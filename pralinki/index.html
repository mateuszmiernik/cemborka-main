<!DOCTYPE html>
<html lang="pl" class="pralinki-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#321B0B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kolekcja Pralinki - CEMBORKA</title>
    <meta name="description" content="Poznaj nową kolekcję Pralinki CEMBORKA — sześć małych torebek prezentowanych w pudełku.">
    <link rel="canonical" href="https://www.cemborka.com/pralinki/">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:site_name" content="CEMBORKA">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kolekcja Pralinki - CEMBORKA">
    <meta property="og:description" content="Poznaj nową kolekcję Pralinki CEMBORKA — sześć małych torebek prezentowanych w pudełku.">
    <meta property="og:url" content="https://www.cemborka.com/pralinki/">
    <meta property="og:image" content="https://www.cemborka.com/images/PLIKI/ZDJECIE%20PUDE%C5%81KO.webp">
    <meta property="og:image:alt" content="Pudełko kolekcji Pralinki CEMBORKA z sześcioma torebkami">
    <script>
      (function() {
        var isGithub = /github\.io$/i.test(window.location.hostname);
        var basePath = isGithub ? '/cemborka-main/' : '/';
        document.write('<base href="' + window.location.origin + basePath + '">');
      })();
    </script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CEMBORKA">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="pralinki-page">
    <header class="header">
        <div class="header-container">
            <button class="back-button" type="button" aria-label="Wróć na stronę główną">
                <img src="images/back-icon.png" alt="" class="back-icon">
            </button>
            <a href="./" class="logo" aria-label="CEMBORKA — strona główna">
                <img src="images/logo.png" alt="CEMBORKA">
            </a>
            <button class="menu-button" aria-label="Menu" aria-expanded="false" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="pralinki-main" id="pralinkiMainView">
        <h1 class="visually-hidden">Nowa kolekcja CEMBORKA — Pralinki</h1>
        <section class="pralinki-collection" id="pralinkiCollectionView" aria-label="Kolekcja Pralinki — wybierz torebkę">
            <div class="pralinki-artwork">
                <picture class="pralinki-artwork-picture">
                    <source media="(max-width: 700px)" srcset="images/PLIKI/Obszar%20kompozycji%201%20kopia%202.webp">
                    <img
                        src="images/PLIKI/ZDJECIE PUDEŁKO.webp"
                        alt="Kolekcja Pralinki: sześć małych torebek w pudełku"
                        class="pralinki-artwork-image"
                        width="3730"
                        height="2160"
                        fetchpriority="high"
                        decoding="async"
                    >
                </picture>
                <div class="pralinki-hotspots">
                    <button class="pralinki-hotspot" type="button" data-pralinka="landrynka" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Landrynka" data-color="Landrynka"><span class="visually-hidden">Landrynka</span></button>
                    <button class="pralinki-hotspot" type="button" data-pralinka="mieta" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Mięta w czekoladzie" data-color="Mięta w czekoladzie"><span class="visually-hidden">Mięta w czekoladzie</span></button>
                    <button class="pralinki-hotspot" type="button" data-pralinka="zurawina" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Żurawina" data-color="Żurawina"><span class="visually-hidden">Żurawina</span></button>
                    <button class="pralinki-hotspot" type="button" data-pralinka="makowka" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Makówka" data-color="Makówka"><span class="visually-hidden">Makówka</span></button>
                    <button class="pralinki-hotspot" type="button" data-pralinka="sliwka" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Śliwka" data-color="Śliwka"><span class="visually-hidden">Śliwka</span></button>
                    <button class="pralinki-hotspot" type="button" data-pralinka="wisnia" aria-controls="pralinkiSelectionScreen" aria-label="Wybierz torebkę Pralinka, Wiśnia w czekoladzie" data-color="Wiśnia w czekoladzie"><span class="visually-hidden">Wiśnia w czekoladzie</span></button>
                </div>
            </div>
        </section>
    </main>

    <section class="pralinki-selection-screen" id="pralinkiSelectionScreen" aria-labelledby="pralinkiSelectionTitle" aria-hidden="true" hidden>
        <h2 class="visually-hidden" id="pralinkiSelectionTitle" tabindex="-1"></h2>
        <div class="pralinki-carousel" role="group" aria-label="Karuzela wariantów torebki Pralinka">
            <button class="pralinki-carousel-arrow pralinki-carousel-arrow--previous" id="pralinkiCarouselPrevious" type="button" aria-label="Poprzednia torebka">
                <span aria-hidden="true">‹</span>
            </button>
            <div class="pralinki-carousel-track" id="pralinkiCarouselTrack" aria-live="off"></div>
            <button class="pralinki-carousel-arrow pralinki-carousel-arrow--next" id="pralinkiCarouselNext" type="button" aria-label="Następna torebka">
                <span aria-hidden="true">›</span>
            </button>
        </div>
        <p class="visually-hidden pralinki-carousel-status" id="pralinkiCarouselStatus" aria-live="polite"></p>
    </section>

    <script src="js/data.js?v=5"></script>
    <script src="js/script.js?v=5"></script>
    <script src="js/pralinki.js?v=5"></script>
</body>
</html>
